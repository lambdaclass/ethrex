# Overrides multisync's compose for the full-sync throughput bench (issue #7111).
#
# Applied on top of docker-compose.multisync.yaml so the per-network service pairs, JWT
# setup and volumes are defined in exactly one place:
#
#   docker compose -p fullsync-bench \
#     -f docker-compose.multisync.yaml -f docker-compose.fullsync-bench.yaml ...
#
# Differences from multisync:
#   1. `--syncmode` defaults to full — this measures execution, not snap-sync completion.
#      Bootstrapping the first base overrides it to snap via BENCH_SYNCMODE.
#   2. `mem_limit` — a memory leak must OOM-kill the container, not take down the box.
#   3. the beacon APIs are published on loopback only, because the runner reads the
#      consensus head to compute each cycle's gap-maintaining advance target and nothing
#      off-box has any business reaching them.
#   4. data lives in bind mounts under BENCH_DATA_ROOT rather than named volumes, so the
#      node data and the base snapshots share one filesystem. `rsync --link-dest` only
#      hardlinks within a filesystem; split across two it degrades to full copies without
#      saying so, and every retained generation costs a whole DB instead of a delta.
#   5. `--purge-db-force` (not multisync's `--purge-db`, which lighthouse ignores when
#      not attached to a TTY, so in a container it silently does nothing) is load-bearing: recreating the beacon node
#      before each leg re-checkpoint-syncs it to the tip, which is what makes the execution
#      node do bulk 1024-block batch sync. Without it the pair crawl forward together ~30
#      blocks at a time and no throughput metric is emitted at all.
services:
  # Generate the JWT once and keep it. Multisync mints a fresh one on every start, which is
  # fine there because it wipes its volumes between runs — but here the beacon node is
  # recreated before every leg, and a new secret would leave the already-running execution
  # node holding the old one. Engine auth then fails, fork choice never reaches the node,
  # and it sits there syncing nothing while looking healthy.
  # Also writes with `>` rather than `tee`, to keep the secret out of the container log.
  setup-jwt-hoodi: &bench-jwt
    command: >
      sh -c 'apk add openssl &&
      { [ -s /secrets/jwt.hex ] || openssl rand -hex 32 | tr -d "\n" > /secrets/jwt.hex; }'

  setup-jwt-sepolia:
    <<: *bench-jwt

  setup-jwt-mainnet:
    <<: *bench-jwt

  consensus-hoodi:
    volumes:
      - secrets-hoodi:/secrets
      - ${BENCH_DATA_ROOT:-/mnt/raid10/fullsync-bench}/consensus/hoodi:/root/.lighthouse
    ports:
      - "127.0.0.1:5052:5052"
    command: >
      lighthouse bn
      --network hoodi
      --http --http-address 0.0.0.0
      --execution-endpoint http://ethrex-hoodi:8551
      --execution-jwt /secrets/jwt.hex
      --checkpoint-sync-url https://checkpoint-sync.hoodi.ethpandaops.io
      --checkpoint-sync-url-timeout 600
      --purge-db-force

  consensus-sepolia:
    volumes:
      - secrets-sepolia:/secrets
      - ${BENCH_DATA_ROOT:-/mnt/raid10/fullsync-bench}/consensus/sepolia:/root/.lighthouse
    ports:
      - "127.0.0.1:5053:5052"
    command: >
      lighthouse bn
      --network sepolia
      --http --http-address 0.0.0.0
      --execution-endpoint http://ethrex-sepolia:8551
      --execution-jwt /secrets/jwt.hex
      --checkpoint-sync-url https://checkpoint-sync.sepolia.ethpandaops.io
      --checkpoint-sync-url-timeout 600
      --purge-db-force

  consensus-mainnet:
    volumes:
      - secrets-mainnet:/secrets
      - ${BENCH_DATA_ROOT:-/mnt/raid10/fullsync-bench}/consensus/mainnet:/root/.lighthouse
    ports:
      - "127.0.0.1:5054:5052"
    command: >
      lighthouse bn
      --network mainnet
      --http --http-address 0.0.0.0
      --execution-endpoint http://ethrex-mainnet:8551
      --execution-jwt /secrets/jwt.hex
      --checkpoint-sync-url https://mainnet-checkpoint-sync.attestant.io
      --checkpoint-sync-url-timeout 600
      --purge-db-force

  ethrex-hoodi: &bench-el
    mem_limit: 48g
    volumes:
      - secrets-hoodi:/secrets
      - ${BENCH_DATA_ROOT:-/mnt/raid10/fullsync-bench}/data/hoodi:/data
    command: >
      --http.addr 0.0.0.0
      --http.api eth,net,web3,admin
      --network hoodi
      --authrpc.addr 0.0.0.0
      --authrpc.jwtsecret /secrets/jwt.hex
      --syncmode ${BENCH_SYNCMODE:-full}
      --datadir /data
      --metrics --metrics.addr 0.0.0.0 --metrics.port 3701

  ethrex-sepolia:
    <<: *bench-el
    volumes:
      - secrets-sepolia:/secrets
      - ${BENCH_DATA_ROOT:-/mnt/raid10/fullsync-bench}/data/sepolia:/data
    command: >
      --http.addr 0.0.0.0
      --http.api eth,net,web3,admin
      --network sepolia
      --authrpc.addr 0.0.0.0
      --authrpc.jwtsecret /secrets/jwt.hex
      --syncmode ${BENCH_SYNCMODE:-full}
      --datadir /data
      --metrics --metrics.addr 0.0.0.0 --metrics.port 3701

  ethrex-mainnet:
    <<: *bench-el
    volumes:
      - secrets-mainnet:/secrets
      - ${BENCH_DATA_ROOT:-/mnt/raid10/fullsync-bench}/data/mainnet:/data
    command: >
      --http.addr 0.0.0.0
      --http.api eth,net,web3,admin
      --network mainnet
      --authrpc.addr 0.0.0.0
      --authrpc.jwtsecret /secrets/jwt.hex
      --syncmode ${BENCH_SYNCMODE:-full}
      --datadir /data
      --metrics --metrics.addr 0.0.0.0 --metrics.port 3701

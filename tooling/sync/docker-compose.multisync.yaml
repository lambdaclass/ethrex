# Multi-network parallel snapsync
#
# For full documentation, see: tooling/sync/README.md (section "Multi-Network Parallel Snapsync")
#
# This file defines 5 networks: hoodi, sepolia, mainnet, hoodi-2, and
# plataberget. By default, the Makefile starts only hoodi, sepolia, and mainnet.
#
# Usage via Makefile (recommended):
#   make multisync-loop                    # Start default networks and monitor continuously
#   make multisync-run                     # Single sync cycle
#   make multisync-loop MULTISYNC_NETWORKS=hoodi,sepolia  # Custom network subset
#
# Direct docker compose usage (starts ALL 4 networks):
#   docker compose -f docker-compose.multisync.yaml up -d
#   docker compose -f docker-compose.multisync.yaml logs -f
#   docker compose -f docker-compose.multisync.yaml down -v
#
# To start a subset directly with docker compose:
#   docker compose -f docker-compose.multisync.yaml up -d ethrex-hoodi consensus-hoodi setup-jwt-hoodi
#
# Each network runs in isolation with its own volumes.
# Host ports are mapped for external RPC access:
#   hoodi:       localhost:8545
#   sepolia:     localhost:8546
#   mainnet:     localhost:8547
#   hoodi-2:     localhost:8548
#   plataberget: localhost:8549

x-ethrex-common: &ethrex-common
  image: "${ETHREX_IMAGE:-ghcr.io/lambdaclass/ethrex:main}"
  pull_policy: "${ETHREX_PULL_POLICY:-always}"
  environment:
    RUST_LOG: "${RUST_LOG:-info,ethrex_p2p::sync=debug}"
    # Bound RocksDB resident memory (default 12 GiB) so 3 parallel snapsyncs fit in host RAM.
    ETHREX_ROCKSDB_BLOCK_CACHE_SIZE: "${ETHREX_ROCKSDB_BLOCK_CACHE_SIZE:-4294967296}"  # 4 GiB
  ulimits:
    nofile: 1000000
  restart: unless-stopped
  # Metrics are exposed via --metrics in each container's command.
  # Only mainnet maps to host port 3701 (scraped by centralized Prometheus).

x-consensus-common: &consensus-common
  image: sigp/lighthouse:v8.0.1
  restart: unless-stopped

services:
  # =============================================================================
  # HOODI
  # =============================================================================
  setup-jwt-hoodi:
    image: alpine
    volumes:
      - secrets-hoodi:/secrets
    command: sh -c 'apk add openssl && openssl rand -hex 32 | tr -d "\n" | tee /secrets/jwt.hex'

  consensus-hoodi:
    <<: *consensus-common
    container_name: consensus-hoodi
    volumes:
      - secrets-hoodi:/secrets
      - consensus-hoodi:/root/.lighthouse
    command: >
      lighthouse bn
      --network hoodi
      --http --http-address 0.0.0.0
      --execution-endpoint http://ethrex-hoodi:8551
      --execution-jwt /secrets/jwt.hex
      --checkpoint-sync-url https://checkpoint-sync.hoodi.ethpandaops.io
      --checkpoint-sync-url-timeout 600
      --purge-db
    depends_on:
      setup-jwt-hoodi:
        condition: service_completed_successfully

  ethrex-hoodi:
    <<: *ethrex-common
    container_name: ethrex-hoodi
    ports:
      - "8545:8545"  # RPC
      - "3702:3701"  # Metrics
    volumes:
      - secrets-hoodi:/secrets
      - ethrex-hoodi:/data
    command: >
      --http.addr 0.0.0.0
      --http.api eth,net,web3,admin
      --network hoodi
      --authrpc.addr 0.0.0.0
      --authrpc.jwtsecret /secrets/jwt.hex
      --syncmode snap
      --datadir /data
      --metrics --metrics.addr 0.0.0.0 --metrics.port 3701
    depends_on:
      setup-jwt-hoodi:
        condition: service_completed_successfully

  # =============================================================================
  # SEPOLIA
  # =============================================================================
  setup-jwt-sepolia:
    image: alpine
    volumes:
      - secrets-sepolia:/secrets
    command: sh -c 'apk add openssl && openssl rand -hex 32 | tr -d "\n" | tee /secrets/jwt.hex'

  consensus-sepolia:
    <<: *consensus-common
    container_name: consensus-sepolia
    volumes:
      - secrets-sepolia:/secrets
      - consensus-sepolia:/root/.lighthouse
    command: >
      lighthouse bn
      --network sepolia
      --http --http-address 0.0.0.0
      --execution-endpoint http://ethrex-sepolia:8551
      --execution-jwt /secrets/jwt.hex
      --checkpoint-sync-url https://checkpoint-sync.sepolia.ethpandaops.io
      --checkpoint-sync-url-timeout 600
      --purge-db
    depends_on:
      setup-jwt-sepolia:
        condition: service_completed_successfully

  ethrex-sepolia:
    <<: *ethrex-common
    container_name: ethrex-sepolia
    ports:
      - "8546:8545"  # RPC on different host port
      - "3703:3701"  # Metrics
    volumes:
      - secrets-sepolia:/secrets
      - ethrex-sepolia:/data
    command: >
      --http.addr 0.0.0.0
      --http.api eth,net,web3,admin
      --network sepolia
      --authrpc.addr 0.0.0.0
      --authrpc.jwtsecret /secrets/jwt.hex
      --syncmode snap
      --datadir /data
      --metrics --metrics.addr 0.0.0.0 --metrics.port 3701
    depends_on:
      setup-jwt-sepolia:
        condition: service_completed_successfully

  # =============================================================================
  # MAINNET
  # =============================================================================
  setup-jwt-mainnet:
    image: alpine
    volumes:
      - secrets-mainnet:/secrets
    command: sh -c 'apk add openssl && openssl rand -hex 32 | tr -d "\n" | tee /secrets/jwt.hex'

  consensus-mainnet:
    <<: *consensus-common
    container_name: consensus-mainnet
    volumes:
      - secrets-mainnet:/secrets
      - consensus-mainnet:/root/.lighthouse
    command: >
      lighthouse bn
      --network mainnet
      --http --http-address 0.0.0.0
      --execution-endpoint http://ethrex-mainnet:8551
      --execution-jwt /secrets/jwt.hex
      --checkpoint-sync-url https://mainnet-checkpoint-sync.attestant.io
      --checkpoint-sync-url-timeout 600
      --purge-db
    depends_on:
      setup-jwt-mainnet:
        condition: service_completed_successfully

  ethrex-mainnet:
    <<: *ethrex-common
    container_name: ethrex-mainnet
    ports:
      - "8547:8545"  # RPC on different host port
      - "3701:3701"  # Metrics (scraped by centralized Prometheus)
    volumes:
      - secrets-mainnet:/secrets
      - ethrex-mainnet:/data
    command: >
      --http.addr 0.0.0.0
      --http.api eth,net,web3,admin
      --network mainnet
      --authrpc.addr 0.0.0.0
      --authrpc.jwtsecret /secrets/jwt.hex
      --syncmode snap
      --datadir /data
      --metrics --metrics.addr 0.0.0.0 --metrics.port 3701
    depends_on:
      setup-jwt-mainnet:
        condition: service_completed_successfully

  # =============================================================================
  # HOODI-2
  # =============================================================================
  setup-jwt-hoodi-2:
    image: alpine
    volumes:
      - secrets-hoodi-2:/secrets
    command: sh -c 'apk add openssl && openssl rand -hex 32 | tr -d "\n" | tee /secrets/jwt.hex'

  consensus-hoodi-2:
    <<: *consensus-common
    container_name: consensus-hoodi-2
    volumes:
      - secrets-hoodi-2:/secrets
      - consensus-hoodi-2:/root/.lighthouse
    command: >
      lighthouse bn
      --network hoodi
      --http --http-address 0.0.0.0
      --execution-endpoint http://ethrex-hoodi-2:8551
      --execution-jwt /secrets/jwt.hex
      --checkpoint-sync-url https://checkpoint-sync.hoodi.ethpandaops.io
      --checkpoint-sync-url-timeout 600
      --purge-db
    depends_on:
      setup-jwt-hoodi-2:
        condition: service_completed_successfully

  ethrex-hoodi-2:
    <<: *ethrex-common
    container_name: ethrex-hoodi-2
    ports:
      - "8548:8545"  # RPC on different host port
    volumes:
      - secrets-hoodi-2:/secrets
      - ethrex-hoodi-2:/data
    command: >
      --http.addr 0.0.0.0
      --http.api eth,net,web3,admin
      --network hoodi
      --authrpc.addr 0.0.0.0
      --authrpc.jwtsecret /secrets/jwt.hex
      --syncmode snap
      --datadir /data
      --metrics --metrics.addr 0.0.0.0 --metrics.port 3701
    depends_on:
      setup-jwt-hoodi-2:
        condition: service_completed_successfully

  # =============================================================================
  # PLATABERGET (Glamsterdam public testnet, glamsterdam-devnet-8 spec)
  #
  # Differs from the named networks above: the consensus client must be a
  # Glamsterdam-capable build (stock lighthouse cannot load the gloas fork
  # config), and the network is addressed by config files rather than a
  # `--network` name. The files are fetched once into a shared volume from
  # ethpandaops/glamsterdam-devnets, the source plataberget.dev names as the
  # network's configuration.
  #
  # =============================================================================
  setup-config-plataberget:
    image: alpine
    volumes:
      - config-plataberget:/config
    command: >
      sh -c 'set -e;
      if [ -f /config/genesis.ssz ]; then echo "plataberget config present"; exit 0; fi;
      apk add --no-cache curl;
      BASE=https://raw.githubusercontent.com/ethpandaops/glamsterdam-devnets/master/network-configs/devnet-8/metadata;
      for f in config.yaml genesis.ssz bootstrap_nodes.yaml deposit_contract_block.txt genesis_validators_root.txt;
      do curl -fsSL -o /config/$$f $$BASE/$$f; done;
      echo "plataberget config downloaded"'

  setup-jwt-plataberget:
    image: alpine
    volumes:
      - secrets-plataberget:/secrets
    command: sh -c 'apk add openssl && openssl rand -hex 32 | tr -d "\n" | tee /secrets/jwt.hex'

  consensus-plataberget:
    image: ethpandaops/lodestar:glamsterdam-devnet-8
    restart: unless-stopped
    container_name: consensus-plataberget
    volumes:
      - secrets-plataberget:/secrets
      - config-plataberget:/config:ro
      - consensus-plataberget:/data
    command: >
      beacon
      --dataDir /data
      --paramsFile /config/config.yaml
      --genesisStateFile /config/genesis.ssz
      --bootnodesFile /config/bootstrap_nodes.yaml
      --checkpointSyncUrl https://checkpoint-sync.plataberget.ethpandaops.io
      --execution.urls http://ethrex-plataberget:8551
      --jwtSecret /secrets/jwt.hex
      --rest --rest.address 0.0.0.0
    depends_on:
      setup-jwt-plataberget:
        condition: service_completed_successfully
      setup-config-plataberget:
        condition: service_completed_successfully

  ethrex-plataberget:
    <<: *ethrex-common
    container_name: ethrex-plataberget
    ports:
      - "8549:8545"  # RPC
    volumes:
      - secrets-plataberget:/secrets
      - ethrex-plataberget:/data
    command: >
      --http.addr 0.0.0.0
      --http.api eth,net,web3,admin
      --network plataberget
      --authrpc.addr 0.0.0.0
      --authrpc.jwtsecret /secrets/jwt.hex
      --syncmode snap
      --datadir /data
      --metrics --metrics.addr 0.0.0.0 --metrics.port 3701
    depends_on:
      setup-jwt-plataberget:
        condition: service_completed_successfully

volumes:
  secrets-hoodi:
  secrets-sepolia:
  secrets-mainnet:
  consensus-hoodi:
  consensus-sepolia:
  consensus-mainnet:
  ethrex-hoodi:
  ethrex-sepolia:
  ethrex-mainnet:
  secrets-hoodi-2:
  consensus-hoodi-2:
  ethrex-hoodi-2:
  config-plataberget:
  secrets-plataberget:
  consensus-plataberget:
  ethrex-plataberget:

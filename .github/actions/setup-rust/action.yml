name: 'Setup Rust Environment'
description: 'Sets up Rust and caches dependencies'
inputs:
  components:
    description: "Rust components to install (e.g., rustfmt, clippy)"
    required: false
    default: ""
  cache-pool:
    description: >
      Name of the cache pool to share with other jobs that build a comparable
      dependency graph (e.g. "l1", "l2", "ef-tests"). Jobs in the same pool read
      and write one cache entry per platform instead of one per job. Leave unset
      to fall back to a per-job entry.
    required: false
    default: ""
  save-cache:
    description: "Set to 'false' for jobs whose target dir is not worth a pool slot."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Extract Rust version from rust-toolchain.toml
      id: rustver
      shell: bash
      run: |
        rust_version=$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml \
                 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "rust_version=${rust_version}" >>"$GITHUB_OUTPUT"
        echo "Rust version: ${rust_version}"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rustver.outputs.rust_version }}
        components: ${{ inputs.components }}

    # The Actions cache budget defaults to 10GB per repository and is evicted
    # LRU, while one target dir here runs 1.2-2.75GB, so the budget holds only a
    # handful of entries. Two rules keep them from evicting each other:
    #
    # - Only main writes. Entries saved on a PR ref are unreadable from every
    #   other branch, so they cost budget without ever being restored.
    # - Jobs building comparable dependency graphs share one entry via
    #   `cache-pool` (rust-cache's `shared-key`), which replaces the per-job
    #   segment of the key. One writer per pool keeps the entry to the widest
    #   dependency set in it; the rest restore only. Per-job keys would put ~32
    #   writers on main, several times what the budget holds.
    #
    # `tooling` is a second workspace with its own target dir, and the default
    # `workspaces` covers only the repo root, so the ef_tests, reorgs, loc and
    # hive_report builds were never cached at all.
    - name: Add Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-pool }}
        save-if: ${{ inputs.save-cache == 'true' && github.ref == 'refs/heads/main' }}
        workspaces: |
          .
          tooling

name: 'Setup Rust Environment'
description: 'Sets up Rust and caches dependencies'
inputs:
  components:
    description: "Rust components to install (e.g., rustfmt, clippy)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Extract Rust version from rust-toolchain.toml
      id: rustver
      shell: bash
      run: |
        rust_version=$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml \
                 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "rust_version=${rust_version}" >>"$GITHUB_OUTPUT"
        echo "Rust version: ${rust_version}"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rustver.outputs.rust_version }}
        components: ${{ inputs.components }}

    # Only main writes the cargo cache. A repo has a 10GB Actions cache budget
    # with LRU eviction, and a single release target dir here is ~2.75GB, so
    # letting every PR job save means the entries evict each other and almost
    # every run builds cold. Caches saved on PR refs are also unreadable from
    # any other branch, whereas main's are readable everywhere.
    - name: Add Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}


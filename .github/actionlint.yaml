self-hosted-runner:
  # Labels of self-hosted runner in array of strings.
  labels:
    - gpu
    - ethrex-sync
    # GitHub-hosted, not self-hosted: actionlint 1.7.12 predates the
    # ubuntu-26.04 image and rejects the label as unknown.
    - ubuntu-26.04
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # Same-repository actions (`uses: $/…`, from `gh actions-lock`) run at
      # the workflow's own commit, so they take no `@ref`. actionlint 1.7.12
      # doesn't know the syntax yet and reports a missing ref.
      - 'specifying action "\$/.+" in invalid format because ref is missing'

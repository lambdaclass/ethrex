# Hive EELS simulator configuration
# Pinned to tests@v21.0.2 (execution-specs mainnet fixture release). From
# tests@v21.0.0 on, the mainnet release carries every fork through Amsterdam, so
# every EELS hive job reads this one file.
# Keep this in lock-step with `tooling/ef_tests/.fixtures_url`: the two pins grade
# the same client, so a release that only one of them follows fails every fixture
# the other release changed.
# EELS simulator image tag of that release: its fixtures and test sources with
# the execution-specs framework it was published with. The image's framework
# descends from execution-specs ecd94a47 (PR #3104), which carries the ethrex
# INVALID_SIGNATURE_VRS exception mappings.
tag: v21.0.2

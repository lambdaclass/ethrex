name: Github Actions
on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths:
      - ".github/**.yaml"
      - ".github/*.yml"
      - ".github/actions/**"
      # Without this, editing a script under .github/scripts would not run the
      # jobs below that exercise those scripts.
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -ignore SC2086 -ignore SC2006 -ignore SC2046

  image-meta:
    name: build-docker image-meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Assert image-meta derivation across ref types
        env:
          SCRIPT: .github/actions/build-docker/image-meta.sh
        run: |
          set -euo pipefail
          # Exercises the REAL script the build-docker action runs, so a future
          # edit that breaks the release version string fails here, not in a release.
          derive() { # derive <ref_type> <ref_name> <head_ref> -> "channel|version"
            local out
            out="$(mktemp)"
            REF_TYPE="$1" REF_NAME="$2" HEAD_REF="$3" SHA="deadbeef" GITHUB_OUTPUT="$out" bash "$SCRIPT"
            printf '%s|%s' "$(sed -n 's/^channel=//p' "$out")" "$(sed -n 's/^version=//p' "$out")"
          }
          check() { # check <desc> <ref_type> <ref_name> <head_ref> <expected>
            local got
            got="$(derive "$2" "$3" "$4")"
            if [ "$got" != "$5" ]; then
              echo "::error::$1: got '$got', expected '$5'"
              exit 1
            fi
            echo "ok  $1 -> $got"
          }
          check "rc.1 tag"      tag    v18.0.0-rc.1 ""     "rc.1|18.0.0"
          check "rc.2 tag"      tag    v18.0.0-rc.2 ""     "rc.2|18.0.0"
          check "alpha pre-tag" tag    v0.0.2-alpha ""     "alpha|0.0.2"
          check "final tag"     tag    v18.0.0      ""     "release|18.0.0"
          check "main push"     branch main         ""     "main|dev-deadbeef"
          check "PR build"      branch main         feat/x "feat/x|dev-deadbeef"

  stateless-signing:
    name: sign-stateless-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Assert the signing script signs and refuses to no-op
        env:
          SCRIPT: .github/scripts/sign-stateless-artifacts.sh
        run: |
          set -euo pipefail
          # Exercises the REAL script finalize-release runs, with a throwaway
          # keypair. Its value is entirely in its guards — an unsigned release
          # that still looks green is the failure it exists to prevent — so each
          # guard is asserted to fail with its OWN diagnostic, not merely to
          # exit non-zero: a guard whose removal is masked by some later failure
          # has silently stopped being tested.
          # The committed public key is the trust anchor consumers verify
          # against, and the release now hard-fails if it does not match the
          # signing key. A corrupted or truncated commit of it must therefore
          # surface here, not at release time.
          python3 - <<'EOF'
          import base64, pathlib, sys
          path = pathlib.Path(".github/minisign.pub")
          if not path.is_file():
              sys.exit("::error::.github/minisign.pub is missing")
          lines = [l for l in path.read_text().splitlines() if l.strip()]
          if len(lines) != 2 or not lines[0].startswith("untrusted comment:"):
              sys.exit("::error::.github/minisign.pub is not a minisign public key file")
          raw = base64.b64decode(lines[1], validate=True)
          if len(raw) != 42 or raw[:2] != b"Ed":
              sys.exit(f"::error::.github/minisign.pub is not a 42-byte Ed25519 minisign key (got {len(raw)} bytes, algo {raw[:2]!r})")
          key_id = format(int.from_bytes(raw[2:10], "little"), "016X")
          if key_id not in lines[0]:
              sys.exit(f"::error::.github/minisign.pub comment does not name its key id {key_id}")
          print(f"ok  committed public key is well-formed (key id {key_id})")
          EOF

          work="$(mktemp -d)"
          minisign -G -W -p "$work/pub" -s "$work/key" > /dev/null
          minisign -G -W -p "$work/other.pub" -s "$work/other.key" > /dev/null
          printf 'pw\npw\n' | minisign -G -p "$work/pw.pub" -s "$work/pw.key" > /dev/null 2>&1
          export MINISIGN_SECRET_KEY
          MINISIGN_SECRET_KEY="$(cat "$work/key")"

          # Rebuild the layout download-artifact produces: one directory per
          # artifact, including a non-stateless one that must be left alone.
          make_tree() {
            local root="$1"
            rm -rf "$root"
            for name in stateless-validator-ethrex-sp1-6.3.1 stateless-validator-ethrex-zisk-1.0.0-alpha; do
              mkdir -p "$root/$name"
              head -c 256 /dev/urandom > "$root/$name/$name.elf"
              head -c 64 /dev/urandom > "$root/$name/$name.vk"
            done
            mkdir -p "$root/ethrex-linux-x86_64"
            head -c 64 /dev/urandom > "$root/ethrex-linux-x86_64/ethrex"
          }

          verify_all() { # verify_all <dir> <pubkey>
            local n=0 f
            for f in "$1"/stateless-validator-*/*.elf "$1"/stateless-validator-*/*.vk; do
              minisign -V -m "$f" -p "$2" -x "$f.minisig" > /dev/null
              n=$((n + 1))
            done
            if [ "$n" -ne 4 ]; then
              echo "::error::expected 4 signed artifacts, verified $n"
              exit 1
            fi
          }

          expect_fail() { # expect_fail <desc> <committed-pub> <dir> <expected-msg>
            local out
            out="$(mktemp)"
            if COMMITTED_PUBLIC_KEY="$2" bash "$SCRIPT" "$3" > "$out" 2>&1; then
              echo "::error::$1: script succeeded but must fail"
              exit 1
            fi
            if ! grep -qF "$4" "$out"; then
              echo "::error::$1: failed for the wrong reason; expected '$4', got:"
              cat "$out"
              exit 1
            fi
            echo "ok  rejects: $1"
          }

          # ── No committed public key ────────────────────────────────────────
          # The state the repository is in right now: the signing secrets exist
          # but .github/minisign.pub has not been committed yet. This MUST still
          # produce a signed release, or adding the secret would have broken the
          # next tag.
          make_tree "$work/bin"
          out="$(mktemp)"
          COMMITTED_PUBLIC_KEY="$work/absent.pub" TRUSTED_COMMENT_SUFFIX="ethrex v0.0.0-test deadbeef" \
            bash "$SCRIPT" "$work/bin" > "$out" 2>&1
          verify_all "$work/bin" "$work/pub"
          grep -qF "::warning::No committed public key" "$out" || {
            echo "::error::expected a warning about the missing committed key"; cat "$out"; exit 1; }
          # The derived key must be printed, so a maintainer can commit it.
          grep -qF "$(grep -v '^untrusted' "$work/pub")" "$out" || {
            echo "::error::the derived public key was not printed"; cat "$out"; exit 1; }
          diff <(grep -v '^untrusted' "$work/bin/minisign/minisign.pub") \
               <(grep -v '^untrusted' "$work/pub") > /dev/null
          echo "ok  signs with a derived key when none is committed, and says so"

          # ── Committed public key present ───────────────────────────────────
          make_tree "$work/bin2"
          COMMITTED_PUBLIC_KEY="$work/pub" bash "$SCRIPT" "$work/bin2" > /dev/null
          verify_all "$work/bin2" "$work/pub"
          test -f "$work/bin2/minisign/minisign.pub"
          echo "ok  signs and verifies against a committed key"

          # Scoped to the stateless artifacts: the node binary is not signed.
          if [ -e "$work/bin2/ethrex-linux-x86_64/ethrex.minisig" ]; then
            echo "::error::signed a non-stateless artifact"
            exit 1
          fi
          echo "ok  leaves non-stateless artifacts unsigned"

          # A tampered artifact must stop verifying, proving the signature binds
          # the bytes rather than just existing.
          elf="$work/bin2/stateless-validator-ethrex-sp1-6.3.1/stateless-validator-ethrex-sp1-6.3.1.elf"
          printf 'x' >> "$elf"
          if minisign -V -m "$elf" -p "$work/pub" > /dev/null 2>&1; then
            echo "::error::a tampered artifact still verified"
            exit 1
          fi
          echo "ok  tampered artifact fails verification"

          # ── MINISIGN_PUBLIC_KEY cross-check ────────────────────────────────
          # The secret is a recorded copy, not a substitute for the derived key:
          # a matching one is confirmed, a stale one fails rather than being
          # published in place of the real key.
          make_tree "$work/bin-sec"
          out="$(mktemp)"
          MINISIGN_PUBLIC_KEY="$(cat "$work/pub")" COMMITTED_PUBLIC_KEY="$work/absent.pub" \
            bash "$SCRIPT" "$work/bin-sec" > "$out" 2>&1
          verify_all "$work/bin-sec" "$work/pub"
          grep -qF "matches the MINISIGN_PUBLIC_KEY secret" "$out" || {
            echo "::error::a matching MINISIGN_PUBLIC_KEY was not confirmed"; cat "$out"; exit 1; }
          echo "ok  confirms a matching MINISIGN_PUBLIC_KEY secret"

          make_tree "$work/bin-stale"
          out="$(mktemp)"
          if MINISIGN_PUBLIC_KEY="$(cat "$work/other.pub")" COMMITTED_PUBLIC_KEY="$work/absent.pub" \
               bash "$SCRIPT" "$work/bin-stale" > "$out" 2>&1; then
            echo "::error::a stale MINISIGN_PUBLIC_KEY was accepted"
            exit 1
          fi
          grep -qF "the MINISIGN_PUBLIC_KEY secret" "$out" || {
            echo "::error::stale secret failed for the wrong reason:"; cat "$out"; exit 1; }
          echo "ok  rejects: a stale MINISIGN_PUBLIC_KEY secret"

          # ── Guards ─────────────────────────────────────────────────────────
          make_tree "$work/bin3"
          expect_fail "a committed key from a different keypair" "$work/other.pub" "$work/bin3" \
            "does not match"
          expect_fail "an artifact set with nothing to sign" "$work/pub" "$work/empty-dir" \
            "does not exist"
          mkdir -p "$work/empty/ethrex-linux-x86_64"
          head -c 8 /dev/urandom > "$work/empty/ethrex-linux-x86_64/ethrex"
          expect_fail "an artifact directory with no stateless assets" "$work/pub" "$work/empty" \
            "no stateless-validator .elf/.vk artifacts found"

          # A wrong password must fail loudly rather than produce a key that
          # silently disagrees with the one used to sign.
          MINISIGN_SECRET_KEY="$(cat "$work/pw.key")"
          MINISIGN_PASSWORD="wrong" expect_fail "a wrong key password" "$work/pw.pub" "$work/bin3" \
            "could not derive the public key"

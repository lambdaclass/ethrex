name: no_std compatibility

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
    paths:
      - "crates/common/**"
      - "crates/vm/**"
      - "crates/guest-program/**"
      - ".github/targets/**"
      - ".github/workflows/pr_nostd.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  no-std-check:
    # Builds the guest crates against the eth-act zkVM standard target to catch
    # `use std::` regressions. Needs nightly (JSON target spec + build-std);
    # see .github/targets/README.md.
    name: no_std build check (riscv64im_zicclsm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned for reproducibility (build-std + json-target-spec are nightly-only);
      # bump the date deliberately. dtolnay has no per-date ref, so pass it as input.
      - name: Install Rust nightly + rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-29
          components: rust-src

      - name: Check no_std crates against the zkVM standard target
        run: |
          TARGET=.github/targets/riscv64im_zicclsm-unknown-none-elf.json
          cargo +nightly-2026-06-29 -Z json-target-spec -Z build-std=core,alloc check \
            -p ethrex-rlp -p ethrex-crypto -p ethrex-trie --no-default-features --target "$TARGET"
          cargo +nightly-2026-06-29 -Z json-target-spec -Z build-std=core,alloc check \
            -p ethrex-crypto --no-default-features --features kzg-rs --target "$TARGET"

  stateless-validator-features:
    # The stateless-validator guest is its own workspace, so `cargo check
    # --workspace` never sees it, and its zkVM crypto providers sit behind
    # features a host build does not enable. Without this, the first thing to
    # compile `crypto/zkvm_interface.rs` is the Ere docker build in tag_release.
    name: stateless-validator feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust

      - name: Check each feature combination
        working-directory: crates/guest-program/stateless-validator
        run: |
          set -euo pipefail
          # `host` alone compiles neither crypto provider, which is why it missed
          # the alloc regression — check the providers too.
          for features in host ere zkvm-interface host,ere; do
            echo "::group::cargo check --features $features"
            cargo check --features "$features" --all-targets
            echo "::endgroup::"
          done

          # openvm is deliberately absent: its crates need a newer rustc than the
          # pinned toolchain, and the openvm bin carries a `[patch]` this crate
          # does not, so a check here resolves different versions than the real
          # build. `extern crate alloc` is crate-level, so the zkvm-interface
          # check above still guards the regression that hit `crypto/openvm.rs`.

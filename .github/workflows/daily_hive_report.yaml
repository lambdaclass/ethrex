name: Daily Hive Report

on:
  schedule:
    # Every day at UTC 03:00
    - cron: "0 3 * * 1,2,3,4,5"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/daily_hive_report.yaml
      - .github/scripts/publish_hive.sh

permissions:
  contents: read
  actions: write

env:
  # Work around frequent libgit2/submodule fetch clakiness in CI.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  run-hive:
    name: Hive - ${{ matrix.test.name }}
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        test:
          # rpc-compat stays on the hive it ran on before the eels switch: from
          # ethereum/hive#1623 its image runs `make build` in the execution-apis
          # checkout, and the execution-apis commit pinned below predates the
          # Makefile (execution-apis#751). Drop the pin once that commit moves.
          - {
              name: "Rpc Compat tests",
              file_name: rpc-compat,
              simulation: ethereum/rpc-compat,
              limit: "",
              hive_version: 7c4c99ebb79955f23e1952fb0282a0dadcb6e181,
            }
          - {
              name: "Devp2p eth tests",
              file_name: devp2p,
              simulation: devp2p,
              limit: "",
            }
          - {
              name: "Engine tests",
              file_name: engine,
              simulation: ethereum/engine,
              limit: "",
            }
          - {
              name: "Sync tests",
              file_name: sync,
              simulation: ethereum/sync,
              limit: "",
            }
          - {
              name: "Consume Engine tests (Rest)",
              file_name: consume-engine-rest,
              simulation: ethereum/eels/consume-engine,
              limit: ".*fork_Paris.*|.*fork_Shanghai.*|.*fork_Cancun.*",
            }
          - {
              name: "Consume Engine tests (Prague)",
              file_name: consume-engine-prague,
              simulation: ethereum/eels/consume-engine,
              limit: ".*fork_Prague.*",
            }
          # Lower parallelism for the same OOM as consume-rlp Amsterdam below:
          # with parallelism 4 the runner gets SIGTERM'd (exit 143) mid-run on
          # the glamsterdam-devnet-8 fixture set; no run has completed since
          # that bump (2026-08-13).
          - {
              name: "Consume Engine tests (Amsterdam)",
              file_name: consume-engine-amsterdam,
              simulation: ethereum/eels/consume-engine,
              limit: ".*fork_.*Amsterdam.*",
              parallelism: 2,
            }
          - {
              name: "Consume RLP tests (Rest)",
              file_name: consume-rlp-rest,
              simulation: ethereum/eels/consume-rlp,
              limit: ".*fork_Paris.*|.*fork_Shanghai.*|.*fork_Cancun.*",
            }
          - {
              name: "Consume RLP tests (Prague)",
              file_name: consume-rlp-prague,
              simulation: ethereum/eels/consume-rlp,
              limit: ".*fork_Prague.*",
            }
          # Lower parallelism to avoid OOM on CI (runner gets SIGTERM'd at ~68min
          # with parallelism 4, likely due to larger BAL fixture set + bigger block bodies)
          - {
              name: "Consume RLP tests (Amsterdam)",
              file_name: consume-rlp-amsterdam,
              simulation: ethereum/eels/consume-rlp,
              limit: ".*fork_.*Amsterdam.*",
              parallelism: 2,
            }
          # consume-wirex has the client sync each test's chain from a mock devp2p
          # peer, so the EELS fixtures also exercise full sync over the eth wire
          # protocol, not only the engine API. It carries two pins of its own: the
          # hive pin below predates the simulator (ethereum/hive#1640), and
          # execution-specs publishes no consume-wirex image per fixture release,
          # so `tag` pins the digest of the `latest` image built on 2026-11-01
          # (fixtures tests@v21.0.2, framework forks/bogota at fd9298410). The
          # run includes the Amsterdam fixtures, so it takes the same lower
          # parallelism as the Amsterdam entries above.
          - {
              name: "Consume WireX tests",
              file_name: consume-wirex,
              simulation: ethereum/eels/consume-wirex,
              limit: "",
              parallelism: 2,
              hive_version: 64d7af92c63962779d0c9bbf404bb58733bd1b05,
              tag: "latest@sha256:7b9f515c21e8b9ee44f535c21103f7c9143a99820cccf3ad1537d68192ade46a",
            }
          - {
              name: "Execute Blobs tests (Osaka)",
              file_name: execute-blobs-osaka,
              simulation: ethereum/eels/execute-blobs,
              limit: "",
              fork: Osaka,
            }
          - {
              name: "Execute Blobs tests (Amsterdam)",
              file_name: execute-blobs-amsterdam,
              simulation: ethereum/eels/execute-blobs,
              limit: "",
              fork: Amsterdam,
            }

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout sources
        uses: actions/checkout@v6.1.0

      # Pin the EELS simulator image tags, see
      # https://github.com/ethereum/hive/blob/master/simulators/ethereum/eels/README.md
      - name: Load EELS config
        id: eels-config
        shell: bash
        run: |
          echo "tag=$(yq -r '.tag' .github/config/hive/mainnet.yaml)" >> "$GITHUB_OUTPUT"

      - name: Determine hive flags
        id: hive-flags
        shell: bash
        env:
          SIMULATION: ${{ matrix.test.simulation }}
          SIM_LIMIT: ${{ matrix.test.limit || '' }}
          SIM_TAG: ${{ matrix.test.tag || '' }}
          SIM_FORK: ${{ matrix.test.fork || '' }}
          EELS_TAG: ${{ steps.eels-config.outputs.tag }}
        run: |
          FLAGS="--sim.parallelism ${{ matrix.test.parallelism || 4 }} --sim.loglevel 1"
          # The EELS simulators run from the image execution-specs publishes for
          # the fixture release pinned in .github/config/hive/mainnet.yaml, which
          # carries every fork through Amsterdam. An entry can pin another image
          # with its own `tag`.
          if [[ "$SIMULATION" == ethereum/eels/* ]]; then
            FLAGS+=" --sim.buildarg tag=${SIM_TAG:-$EELS_TAG}"
          fi

          if [[ "$SIMULATION" == "ethereum/eels/consume-engine" || "$SIMULATION" == "ethereum/eels/consume-rlp" ]]; then
            FLAGS+=" --client.checktimelimit=180s"
          fi

          # The execute simulators drive a live client over RPC instead of consuming
          # fixtures, so each entry names the fork to run in its `fork`.
          if [[ "$SIMULATION" == "ethereum/eels/execute-blobs" ]]; then
            if [[ -n "$SIM_FORK" ]]; then
              FLAGS+=" --sim.buildarg fork=$SIM_FORK"
            fi
            FLAGS+=" --client.checktimelimit=300s"
          fi

          if [[ "$SIMULATION" == "ethereum/rpc-compat" ]]; then
            FLAGS+=" --sim.buildarg branch=d08382ae5c808680e976fce4b73f4ba91647199b"
          fi

          if [[ -n "$SIM_LIMIT" ]]; then
            # Single-quote the limit so regex metacharacters (e.g. the `|` in
            # multi-fork limits) survive the action's shell re-evaluation of
            # extra_flags. Matches pr-main_l1.yaml's escaping.
            escaped_limit=${SIM_LIMIT//\'/\'\\\'\'}
            FLAGS+=" --sim.limit '$escaped_limit'"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Hive Simulation
        id: run-hive-action
        uses: ethpandaops/hive-github-action@v0.5.0
        continue-on-error: true
        with:
          simulator: ${{ matrix.test.simulation }}
          client: ethrex
          # Pin hive to ethereum/hive#1530's merge commit, which fixes the
          # clients/ethrex/mapper.jq depositContractAddress bug from #1507:
          # #1524 wrapped the `//` value in parens (the unparenthesized form was
          # a jq syntax error that stopped the client from starting), and #1530
          # restored the mainnet deposit contract address as the fallback (the
          # zero-address default made every eip6110 deposit / eip7685 request
          # test fail). Also gives the daily report a reproducible hive version
          # instead of floating on the action's default. Now at ethereum/hive#1609's
          # merge commit, which runs the eels simulators from the images
          # execution-specs publishes, selected with `tag=`. A matrix entry can
          # pin its own version, as "Rpc Compat tests" and "Consume WireX tests" do.
          hive_version: ${{ matrix.test.hive_version || '11864a701d331535f4ed487e4d538bead457d760' }}
          extra_flags: ${{ steps.hive-flags.outputs.flags }}
          workflow_artifact_upload: true
          workflow_artifact_prefix: ${{ matrix.test.file_name }}_daily

  hive-report:
    name: Generate and Save report
    needs: run-hive
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    outputs:
      artifact_name: results_daily.md
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.1.0
      - name: Setup Rust Environment
        uses: $/.github/actions/setup-rust
        with:
          cache-pool: l1

      - name: Download all results
        continue-on-error: true
        uses: actions/download-artifact@v6.0.0
        with:
          path: hive/workspace/logs
          pattern: "*_daily-results.zip"
          merge-multiple: true

      - name: Flatten hive result files
        shell: bash
        run: |
          shopt -s globstar nullglob
          mkdir -p hive/workspace/logs
          for json in hive/workspace/logs/**/*.json; do
            base_name=$(basename "$json")
            target="hive/workspace/logs/$base_name"
            if [[ "$json" != "$target" ]]; then
              mv "$json" "$target"
            fi
          done
          find hive/workspace/logs -mindepth 1 -type d -exec rm -rf {} +

      - name: Print failed tests
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          found_failures=false
          for log in hive/workspace/logs/*.log; do
            mapfile -t failures < <(grep 'FAILED ' "$log" | sed -E 's/^.*FAILED ([^ ]+).*/\1/' || true)
            if (( ${#failures[@]} )); then
              found_failures=true
              echo "Failures in $(basename "$log"):"
              printf '  %s\n' "${failures[@]}"
              echo
            fi
          done
          if [ "$found_failures" = false ]; then
            echo "No test failures found in logs."
          fi

      - name: Generate the hive report
        run: cargo run --manifest-path tooling/Cargo.toml -p hive_report > results.md

      - name: Upload daily result
        uses: actions/upload-artifact@v6.0.0
        with:
          name: results_daily.md
          path: |
            results.md
            hive_slack_blocks.json
          if-no-files-found: error

      - name: Post results in summary
        run: |
          echo "# Hive coverage report" >> $GITHUB_STEP_SUMMARY
          cat results.md >> $GITHUB_STEP_SUMMARY

  post-daily-report:
    name: Post report to slack
    needs: [hive-report]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.1.0

      - name: Download hive results
        uses: actions/download-artifact@v6.0.0
        with:
          name: ${{ needs.hive-report.outputs.artifact_name }}

      - name: Post Hive results to Slack
        env:
          SLACK_WEBHOOKS: >
            ${{ github.event_name == 'schedule'
              && secrets.ETHREX_INTERNO_SLACK_WEBHOOK
              || secrets.TEST_CHANNEL_SLACK
            }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for webhook in $SLACK_WEBHOOKS; do
            bash .github/scripts/publish_hive.sh "$webhook" hive_slack_blocks.json "$RUN_URL"
          done
          echo "Sending Results" >> $GITHUB_STEP_SUMMARY

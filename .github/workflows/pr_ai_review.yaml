# AI security review using lambdaclass/actions' multi-model reusable workflow.
#
# Several models review the PR in parallel, a judge checks their findings
# against the code, and one comment is posted (15-35 minutes per review).
# The prompts live in lambdaclass/actions (ai-review/prompts/), pinned below.
# Docs: https://github.com/lambdaclass/actions#multi-model-pr-review
#
# Triggers (never automatic):
# - Comment `/review` on a PR (needs to be on the default branch to work).
#   `/review budget=N` raises the USD budget; `/review continue` finishes a
#   review that stopped at its budget or time limit.
# - Add a label starting with `ai-review` to a PR.
#
# Required secrets:
# - OPENROUTER_API_KEY: every model but Claude. Must belong to the OpenRouter
#   account holding the `air-*` provider presets; its credit limit is the hard
#   spend ceiling.
# - ANTHROPIC_API_KEY: the Opus reviewer.

name: AI Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  review:
    # Adding a label needs triage or write access. Fork PRs are refused here and again in the workflow.
    if: >
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ') || startsWith(github.event.comment.body, fromJSON('"/review\n"')) || startsWith(github.event.comment.body, fromJSON('"/review\r"')))
      ) ||
      (
        github.event_name == 'pull_request' &&
        startsWith(github.event.label.name, 'ai-review') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    uses: lambdaclass/actions/.github/workflows/pr_review_multi.yml@433e036e485e0c5202479bd3c5841fa794b7fd56 # v2.1.0
    permissions:
      contents: read
      pull-requests: write
      actions: read
    with:
      command: /review
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

# EIP-8312 UTXO Frames — PoC devnet.
#
# Three ethrex ELs, so agreement between them exercises the build path against
# the import paths. It does NOT demonstrate cross-client interop: no other
# client implements EIP-8312.
#
# The fork chain must include gloas: fulu/osaka@0 -> gloas/AMSTERDAM@1 ->
# heze/BOGOTA(hegota)@2. gloas is what makes the genesis generator emit
# `amsterdamTime`, which turns on EIP-7928 block access lists, 2D gas accounting
# and the EIP-8037 state-gas reservoir. Skipping it yields a chain that charges
# Amsterdam's repriced costs without Amsterdam's compensating reservoir, which
# breaks large contract deploys in a way that looks unrelated to the fork
# schedule.
#
# EIP-8312 itself is NOT scheduled by this file: the genesis generator cannot
# emit a custom `utxoFramesTime`, so it is patched into each EL's chain config
# after the enclave is up and the ELs are restarted. That is deliberate — it is
# the same state-preserving activation path a production upgrade takes. See
# README.md.
#
# Port ranges are pinned so the enclave does not collide with other workloads or
# with the ephemeral range; adjust to taste.
participants:
  - el_type: ethrex
    el_image: ethrex:eip8312-poc
    el_extra_params: ["--syncmode", "full"]
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-7
    validator_count: 32
    supernode: true
  - el_type: ethrex
    el_image: ethrex:eip8312-poc
    el_extra_params: ["--syncmode", "full"]
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-7
    validator_count: 32
    supernode: true
  - el_type: ethrex
    el_image: ethrex:eip8312-poc
    el_extra_params: ["--syncmode", "full"]
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-7
    validator_count: 32
    supernode: true

network_params:
  seconds_per_slot: 6
  fulu_fork_epoch: 0
  gloas_fork_epoch: 1
  heze_fork_epoch: 2

port_publisher:
  el:
    enabled: true
    public_port_start: 31400
  cl:
    enabled: true
    public_port_start: 31600

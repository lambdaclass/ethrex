[package]
name = "ethrex-metrics"
version.workspace = true
edition.workspace = true
authors.workspace = true
documentation.workspace = true
license.workspace = true
description = "Prometheus metrics collection and exposition for the ethrex Ethereum execution client"
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true

ethrex-common.workspace = true


prometheus = { version = "0.14.0", features = ["process"], optional = true }
axum = { workspace = true, optional = true }
# `/metrics` appends the actor runtime's own series (the `actors` feature).
spawned-concurrency = { workspace = true, optional = true, features = ["metrics"] }
tracing-subscriber.workspace = true


[lib]
path = "./mod.rs"

[features]
default = ["api"]
transactions = []
api = ["dep:axum", "dep:prometheus", "dep:tokio", "dep:tracing"]
metrics = ["dep:prometheus", "dep:tracing"]
# The spawned actor runtime's counters (mailbox depth, queue wait, handler
# time, request outcomes, actor exits), appended to `/metrics` by the API.
actors = ["dep:spawned-concurrency"]

[lints]
workspace = true

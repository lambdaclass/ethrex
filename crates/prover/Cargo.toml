[package]
name = "ethrex-prover"
version.workspace = true
edition.workspace = true
authors.workspace = true
documentation.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"] }
tracing.workspace = true
thiserror.workspace = true
clap.workspace = true
rkyv.workspace = true
bincode = "1.3.3"
url.workspace = true
spawned-concurrency.workspace = true

# ethrex
ethrex-common.workspace = true
libssz.workspace = true
ethrex-vm.workspace = true
ethrex-rlp.workspace = true

ethrex-guest-program = { path = "../guest-program" }

risc0-zkvm = { version = "=3.0.3", optional = true, features = ["getrandom"] }

sp1-sdk = { version = "=6.9.0", optional = true, features = ["blocking"] }

# In-process ZisK proving. Must match the `ziskos` tag in crates/guest-program and
# ZISK_VERSION in .github/actions/install-zisk/action.yml: the proving keys the SDK
# loads and the on-chain PlonkVerifier are generated per ZisK version.
zisk-sdk = { version = "=1.3.2-alpha", optional = true }
hex = { workspace = true, optional = true }

[lib]
name = "ethrex_prover"
path = "src/lib.rs"

[features]
default = []
risc0 = ["ethrex-guest-program/risc0", "dep:risc0-zkvm", "ethrex-common/risc0"]
sp1 = ["ethrex-guest-program/sp1", "dep:sp1-sdk"]
# `zisk` alone gives the guest, `cargo-zisk execute` and `ziskemu` profiling and
# builds on every host. `zisk-sdk` adds in-process proving and verification and is
# Linux x86-64 only (see crates/prover/src/backend/zisk.rs).
zisk = ["ethrex-guest-program/zisk"]
zisk-sdk = ["zisk", "dep:zisk-sdk", "dep:hex"]
# Forces the CPU build of the SDK's prover library on hosts that have a CUDA
# toolkit installed (the SDK compiles its CUDA kernels whenever nvcc is found).
zisk-cpu-only = ["zisk-sdk?/cpu-only"]
profiling = ["sp1-sdk?/profiling"]

gpu = ["risc0-zkvm?/cuda", "sp1-sdk?/cuda"]
l2 = ["ethrex-guest-program/l2"]

# temporary feature until we fix cargo-zisk setup-rom from failing in the CI
ci = ["ethrex-guest-program/ci"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
unnecessary_cast = "warn"
panic = "deny"
redundant_clone = "warn"

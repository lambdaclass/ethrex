[package]
version = "13.0.0"
name = "ethrex-guest-lambdavm"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

# Thin LTO measurably lowers executed guest cycles (~2.3% on lambda_vm's
# committed ethrex_bench fixtures) at a small ELF-size cost, which is free in
# this VM (execution is priced per executed instruction, not by ELF size).
# Cargo's release default is lto = false / codegen-units = 16. Kept identical
# to the guest profile in yetanotherco/lambda_vm so both repos build the same
# ELF.
[profile.release]
lto = "thin"

[dependencies]
# Must match LAMBDA_VM_COMMIT in .github/actions/install-lambdavm/action.yml
# and the lambda-vm-syscalls rev in crates/guest-program/Cargo.toml.
lambda-vm-syscalls = { git = "https://github.com/yetanotherco/lambda_vm.git", rev = "9ccdaf28ab373da0a4a2eb79a16b90479f6686fd" }
rkyv = { version = "0.8.10", features = ["std", "unaligned"] }

ethrex-guest-program = { path = "../../", default-features = false, features = [
    "lambdavm",
] }

[features]
l2 = ["ethrex-guest-program/l2"]
eip-8025 = ["ethrex-guest-program/eip-8025"]

[workspace]

[package]
version = "23.0.0"
name = "stateless-validator-ethrex-sp1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ere-platform-sp1 = { git = "https://github.com/eth-act/ere", tag = "v0.18.1" }

ethrex-stateless-validator = { path = "../..", features = ["ere", "sp1"] }

# FIXME: Remove the patch once https://github.com/succinctlabs/sp1/pull/2865 is merged and released.
# The rev is the head of the fork's `patch/v6.6.0/libzkevm` branch: upstream v6.6.0 plus that PR's
# EIP-2537 and ripemd160 conformance fix. Move it to the matching branch whenever ere moves SP1.
# Do not follow ere's own SP1 pin here: ere's workspace builds against upstream SP1, which still
# lacks the fix.
[patch.crates-io]
sp1-lib = { git = "https://github.com/han0110/sp1", rev = "b4f72fe1de5d6d26b3d3f531fcabd137b03e3338" }

[patch."https://github.com/succinctlabs/sp1.git"]
sp1-lib = { git = "https://github.com/han0110/sp1", rev = "b4f72fe1de5d6d26b3d3f531fcabd137b03e3338" }
sp1-primitives = { git = "https://github.com/han0110/sp1", rev = "b4f72fe1de5d6d26b3d3f531fcabd137b03e3338" }
sp1-zkvm = { git = "https://github.com/han0110/sp1", rev = "b4f72fe1de5d6d26b3d3f531fcabd137b03e3338" }
sp1-libzkevm = { git = "https://github.com/han0110/sp1", rev = "b4f72fe1de5d6d26b3d3f531fcabd137b03e3338", package = "libzkevm" }

[profile.release]
codegen-units = 1
lto = "fat"

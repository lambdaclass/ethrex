[package]
version = "22.0.0"
name = "ethrex-stateless-validator"
edition = "2024"
license = "MIT OR Apache-2.0"

# Own workspace, like the guest bins: this crate enables the eip-8025 feature
# on ethrex-guest-program (and transitively ethrex-vm/ethrex-common), which is
# a guest-only configuration that must not unify into root-workspace builds of
# the node crates.
[workspace]

[dependencies]
thiserror = "2.0.9"
hex-literal = "0.4.1"

ethrex-common = { path = "../../common/", default-features = false }
ethrex-crypto = { path = "../../common/crypto", default-features = false }
ethrex-guest-program = { path = "../", default-features = false, features = ["eip-8025"] }

# Wire-format types (statelessInputBytes/statelessOutputBytes) for the
# stateless-validator guest. Shared with other EL guests (e.g. reth) and owned
# by eth-act, so it is consumed as a pinned git dep rather than vendored.
stateless-validator-common = { git = "https://github.com/eth-act/ere-guests.git", rev = "9d3d4b9157cd0818abf68ebf7213ba041d1e83e9", default-features = false, features = ["std"] }

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

[features]
default = []
# Host-side execution (fixture tests, no zkVM): enables the native crypto
# backends required by NativeCrypto.
host = [
    "ethrex-crypto/blst",
    "ethrex-crypto/kzg-rs",
    "ethrex-crypto/secp256k1",
    "stateless-validator-common/host",
]

[package]
name = "ethrex-l2-prover"
version.workspace = true
edition.workspace = true
authors.workspace = true
documentation.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
bytes.workspace = true
ethereum-types.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
hex.workspace = true
thiserror.workspace = true
clap.workspace = true
rkyv.workspace = true
url.workspace = true

# ethrex
ethrex-common.workspace = true
ethrex-storage.workspace = true
ethrex-vm.workspace = true
ethrex-rlp.workspace = true
ethrex-blockchain.workspace = true

# l2
ethrex-l2 = { path = "../", default-features = false }
ethrex-l2-common = { workspace = true }
ethrex-sdk.workspace = true

ethrex-guest-program = { path = "../../guest-program" }

# shared prover infrastructure; the zkVM backends themselves live there
ethrex-prover = { workspace = true }

[dev-dependencies]
ethrex-storage.workspace = true

[lib]
name = "ethrex_l2_prover"
path = "src/lib.rs"

[features]
# TODO(#2662) Prover shouldn't have l2 as a default but cargo complains about missing field in struct
default = ["l2"]
# prover backends
risc0 = [
    "ethrex-prover/risc0",
    "ethrex-guest-program/risc0-build-elf",
    "ethrex-common/risc0",
]
sp1 = ["ethrex-prover/sp1", "ethrex-guest-program/sp1-build-elf"]
zisk = ["ethrex-prover/zisk", "ethrex-guest-program/zisk-build-elf"]
openvm = ["ethrex-prover/openvm", "ethrex-guest-program/openvm-build-elf"]
profiling = ["ethrex-prover/profiling"]

gpu = ["ethrex-prover/gpu"]
l2 = ["ethrex-prover/l2", "ethrex-guest-program/l2", "ethrex-l2/l2"]

# temporary feature until we fix cargo-zisk setup-rom from failing in the CI
ci = ["ethrex-prover/ci", "ethrex-guest-program/ci"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
unnecessary_cast = "warn"
panic = "deny"
redundant_clone = "warn"

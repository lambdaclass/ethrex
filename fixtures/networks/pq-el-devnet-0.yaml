# pq-el-devnet-0: leanSPHINCS signatures on frame transactions without
# aggregation (EIP-8504), on ethrex with ethlambda as the consensus client.
#
# Both images are built from the `pq-el-devnet-0` branches of the two clients:
#
#   docker build -t ethrex:pq-el-devnet-0 .                      (this repository)
#   docker build -t ethlambda:pq-el-devnet-0 .                   (ethlambda)
#
# Run it with ethpandaops/ethereum-package, which has `cl_type: ethlambda`:
#
#   kurtosis run <ethereum-package> --enclave pq-el-devnet-0 \
#     --args-file fixtures/networks/pq-el-devnet-0.yaml
#
# Then send transactions with tooling/leansphincs_sender, whose 16 default
# accounts are the ones preloaded below (see docs/eip-8504.md).
participants:
  - el_type: ethrex
    el_image: ethrex:pq-el-devnet-0
    el_extra_params:
      # Dependency transactions travel over eth/73, which ethrex offers under
      # the same condition as eth/72.
      - --blob-sampling
    cl_type: ethlambda
    cl_image: ethlambda:pq-el-devnet-0
    vc_type: ethlambda
    vc_image: ethlambda:pq-el-devnet-0
    count: 3

network_params:
  preset: minimal
  # ethlambda's execution payload is the Gloas one, with the dependency
  # witnesses appended, from genesis.
  gloas_fork_epoch: 0
  # Hegota, and EIP-8504 with it, on the execution layer only, one epoch after
  # genesis: the consensus layer stays on Gloas. It cannot be at genesis,
  # because the genesis block the generator computes has no dependency
  # witnesses commitment.
  heze_fork_epoch: 1
  frames_enabled: true
  # The accounts `leansphincs_sender alloc --accounts 16` prints for the
  # default seed, each controlled by a leanSPHINCS key through its code.

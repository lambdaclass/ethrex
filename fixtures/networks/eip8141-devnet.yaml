participants:
  - el_type: ethrex
    el_image: ethrex:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-7
    validator_count: 32
    supernode: true
  - el_type: ethrex
    el_image: ethrex:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-7
    validator_count: 32
  - el_type: ethrex
    el_image: ethrex:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-7
    validator_count: 32

network_params:
  seconds_per_slot: 6
  # Activate Osaka from genesis.
  fulu_fork_epoch: 0
  # Amsterdam (gloas) at epoch 1, ahead of Hegota. Hegota is defined on top of
  # Amsterdam, so `amsterdamTime` has to be set: levm resolves Amsterdam from the
  # fork ordinal while the header schema, the BAL and the Engine API key on the
  # timestamp field. Scheduling it after genesis keeps the beacon genesis state
  # Fulu; a Gloas genesis state is rejected by Lighthouse ("Built-in genesis
  # state SSZ bytes are invalid: OffsetsAreDecreasing(0)").
  gloas_fork_epoch: 1
  # Schedule Hegota (heze) so the EIP-8141 frame-tx opcodes are enabled.
  # The EIP-8141 opcodes (APPROVE 0xAA, TXPARAM 0xB0, FRAMEDATALOAD 0xB1,
  # FRAMEDATACOPY 0xB2, FRAMEPARAM 0xB3, SIGPARAM 0xB4) are gated on Hegota,
  # not Osaka. The ethereum-genesis-generator emits `bogotaTime`/`hezeTime`
  # into the EL genesis JSON, which ethrex parses into
  # `ChainConfig.hegota_time` via its serde aliases. Without this, every
  # frame tx is rejected with FrameTxPreFork. Frame transactions become valid
  # from epoch 2 onward.
  heze_fork_epoch: 2

additional_services:
  - dora

port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000
  additional_services:
    enabled: true
    public_port_start: 34000

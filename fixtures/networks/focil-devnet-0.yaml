# focil-devnet-0 — the FOCIL (EIP-7805) clients that are up to date with the spec.
#
# Client census taken 2026-08-12 from the ethpandaops registry, with the verdict
# from actually booting each one on this devnet:
#
#   ELs   ethrex           ✅ built from this branch
#         besu:focil       2026-07-02  ❌ stale on EIP-8282 (see below)
#         geth:focil       2025-07-31  ❌ over a year old
#         reth                         ❌ only pellekrab-focil_impl, a contributor branch
#   CLs   teku:focil       2026-08-11  ✅ current
#         lodestar:focil   2026-06-22  ❌ stale on the Gloas BeaconState
#         lighthouse:focil 2026-06-16  ❌ stale on the Gloas BeaconState
#
# besu boots and follows the chain until gloas, then rejects every block with
#   SystemCallNoCodeAtAddressException: Invalid system call address:
#   0x0000884d2aa32eaa155f59a2f24efa73d9008282
# It is calling an EIP-8282 builder predeploy that no longer exists. EIPs commit
# 554d3325e (2026-07-08) "set predeploy addresses from current reference
# bytecode" moved them to 0x0000bFF4...300D8282 and 0x000064D6...800E8282, which
# is what the genesis predeploys and what ethrex calls. The besu:focil image is
# six days older than that change. Its validators also drag participation below
# the finality threshold, so it is excluded rather than left stuck.
#
# lodestar and lighthouse predate the summer's Gloas `BeaconState` change and
# cannot read a current genesis at all: against a generator new enough to emit
# `PAYLOAD_DUE_BPS` (which teku requires) lodestar dies in @chainsafe/ssz
# readVariableOffsets with "First offset must equal to fixedEnd 3134845 !=
# 3134333" and lighthouse with "Built-in genesis state SSZ bytes are invalid:
# OffsetsAreDecreasing(0)"; against the older 6.0.6 genesis lighthouse still
# fails with "Failed to build beacon chain: Head block not found in store".
#
# So the matrix is degenerate today - ethrex x teku is the only pairing where
# both sides are current. Re-add the others as their focil images are rebuilt;
# the participant blocks are kept in git history for exactly that.
#
# Three ethrex nodes so the chain has real peers, one of them on
# --mempool.private so private vs gossiping mempool behaviour is observable on
# the same chain.
#
# All CLs: supernode=true (PeerDAS satisfaction at fulu/gloas).
#
# Fork schedule (mainnet preset, 12s slots, so one epoch is 6m24s):
#   * gloas at epoch 1  (~6m24s in)
#   * heze (= our Hegota / EIP-7805 FOCIL) at epoch 2  (~12m48s in)
#
# gloas deliberately does NOT start at genesis. With `gloas_fork_epoch: 0` every
# generator tag tried produces a genesis whose state disagrees with the genesis
# block, and the CL refuses to start ("Genesis block root ... does not match
# genesis state latest block root"). Starting pre-gloas and transitioning avoids
# that path entirely.
#
# The ethrex image is built from this branch rather than pulled: the published
# ethpandaops/ethrex:focil tag tracks the `focil` branch, which predates both
# the glamsterdam-devnet-8 rebase and the forkchoiceUpdatedV5 custodyColumns fix.
#
# Run with:
#   KURTOSIS_CONFIG_FILE=./fixtures/networks/focil-devnet-0.yaml make localnet

participants:
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    cl_type: teku
    cl_image: ethpandaops/teku:focil
    supernode: true
    count: 2
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    el_extra_params:
      - "--mempool.private"
    cl_type: teku
    cl_image: ethpandaops/teku:focil
    supernode: true
    count: 1

network_params:
  preset: mainnet
  gloas_fork_epoch: 1
  heze_fork_epoch: 2

additional_services:
  - dora
  - tx_fuzz
  - spamoor

dora_params:
  image: bbusa/dora:focil

# Generator tag is squeezed from three sides:
#   * 6.0.6 and older predate the `PayloadDueBps` template variable, so their
#     config.yaml carries no `PAYLOAD_DUE_BPS` and teku:focil refuses to start
#     ("missing or invalid values for constants PAYLOAD_DUE_BPS").
#   * 6.1.5 and newer carry generator PR #311 "update to latest spec", which
#     renames the inclusion-list size constant to
#     `MAX_TRANSACTIONS_BYTES_PER_INCLUSION_LIST` — the name consensus-specs has
#     used since the 2026-02-20 Heze promotion. teku:focil still wants the older
#     `MAX_BYTES_PER_INCLUSION_LIST` and logs the new one under "Ignoring unknown
#     items in network configuration" before dying on the missing old name.
#   * 6.2.0 additionally carries PR #313, which deletes the besu and nethermind
#     chainspec templates, while the ethereum-package revision pinned in the
#     Makefile still starts besu with `--genesis-file=/network-configs/besu.json`.
# 6.1.4 is the one tag that satisfies all three.
ethereum_genesis_generator_params:
  image: ethpandaops/ethereum-genesis-generator:6.1.4

spamoor_params:
  spammers:
    - scenario: eoatx
      config:
        throughput: 100
    - scenario: uniswap-swaps
      config:
        throughput: 100
    - scenario: blob-combined
      config:
        throughput: 5

port_publisher:
  additional_services:
    enabled: true
    # Keep 30000 (not the upstream 65500) so the existing Caddy vhosts on
    # ethrex-office-4 (dora.focil.ethrex.xyz → :30000,
    # spamoor.focil.ethrex.xyz → :30004) keep working without rewiring
    # the reverse-proxy + Cloudflare DNS.
    public_port_start: 30000

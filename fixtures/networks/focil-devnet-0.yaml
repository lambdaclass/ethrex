# focil-devnet-0 — full EL × CL matrix over every client that currently ships a
# FOCIL (EIP-7805) build.
#
# Client census taken 2026-08-12 from the ethpandaops registry:
#   ELs   besu:focil       2026-07-02   ✅ maintained
#         ethrex:focil     2026-08-05   ✅ ours (this devnet builds from source)
#         geth:focil       2025-07-31   ❌ over a year stale, excluded
#         reth             only pellekrab-focil_impl (contributor branch), excluded
#   CLs   teku:focil       2026-08-11   ✅
#         lodestar:focil   2026-06-22   ✅
#         lighthouse:focil 2026-06-16   ✅
#
# Matrix (2 ELs × 2 CLs) plus one extra ethrex running --mempool.private, so
# private vs gossiping mempool behaviour is observable on the same chain:
#
#   ethrex × lodestar     besu × lodestar
#   ethrex × lighthouse   besu × lighthouse
#   ethrex × lodestar  (--mempool.private)
#
# teku is left out, and not by preference: the three FOCIL consensus clients
# cannot currently share one genesis. The Gloas `BeaconState` container gained
# variable-length fields over the summer, so the choice of genesis generator
# picks which CLs can start at all:
#
#   * generator <= 6.0.6 emits the June-era state that lodestar:focil
#     (v1.43.0/6506bf4, 2026-06-22) and lighthouse:focil (v8.1.3-52e5197,
#     2026-06-16) were built against, but carries no `PAYLOAD_DUE_BPS`, so
#     teku:focil (2026-08-11) refuses the config outright;
#   * generator >= 6.1.7 emits `PAYLOAD_DUE_BPS` for teku, and then lodestar
#     dies on "First offset must equal to fixedEnd 3134845 != 3134333"
#     (@chainsafe/ssz readVariableOffsets) and lighthouse on "Built-in genesis
#     state SSZ bytes are invalid: OffsetsAreDecreasing(0)".
#
# Nothing on the EL side bridges that. Two of the three have to sit out, so we
# keep the two that pair with the most FOCIL-exercising setup and wait for
# rebuilt lodestar/lighthouse focil images before adding teku back.
#
# All CLs: supernode=true (PeerDAS satisfaction at fulu/gloas).
#
# Fork schedule (mainnet preset, 12s slots):
#   * gloas at epoch 0 (active from genesis)
#   * heze (= our Hegotá / EIP-7805 FOCIL) at epoch 1
#
# The ethrex image is built from this branch rather than pulled: the published
# ethpandaops/ethrex:focil tag tracks the `focil` branch, which predates both
# the glamsterdam-devnet-8 rebase and the forkchoiceUpdatedV5 custodyColumns fix.
#
# Run with:
#   KURTOSIS_CONFIG_FILE=./fixtures/networks/focil-devnet-0.yaml make localnet

participants:
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    cl_type: lodestar
    cl_image: ethpandaops/lodestar:focil
    supernode: true
    count: 1
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:focil
    supernode: true
    count: 1
  - el_type: besu
    el_image: ethpandaops/besu:focil
    cl_type: lodestar
    cl_image: ethpandaops/lodestar:focil
    supernode: true
    count: 1
  - el_type: besu
    el_image: ethpandaops/besu:focil
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:focil
    supernode: true
    count: 1
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    el_extra_params:
      - "--mempool.private"
    cl_type: lodestar
    cl_image: ethpandaops/lodestar:focil
    supernode: true
    count: 1

network_params:
  preset: mainnet
  gloas_fork_epoch: 0
  heze_fork_epoch: 1

additional_services:
  - dora
  - tx_fuzz
  - spamoor

dora_params:
  image: bbusa/dora:focil

# `:6.0.5` (default) and the experimental `:bbusa-fix-gloas-genesis` tag both
# produce SSZ genesis states whose latest_block_header disagrees with the EL
# genesis block root when gloas is active at epoch 0 with mainnet preset;
# lodestar:focil aborts at startup with "Genesis block root ... does not match
# genesis state latest block root". `:6.0.6` fixes that and is the newest tag
# whose BeaconState layout the June-era lodestar and lighthouse focil images can
# still deserialize -- see the teku note above before bumping it.
ethereum_genesis_generator_params:
  image: ethpandaops/ethereum-genesis-generator:6.0.6

spamoor_params:
  spammers:
    - scenario: eoatx
      config:
        throughput: 100
    - scenario: uniswap-swaps
      config:
        throughput: 100
    - scenario: blob-combined
      config:
        throughput: 5

port_publisher:
  additional_services:
    enabled: true
    # Keep 30000 (not the upstream 65500) so the existing Caddy vhosts on
    # ethrex-office-4 (dora.focil.ethrex.xyz → :30000,
    # spamoor.focil.ethrex.xyz → :30004) keep working without rewiring
    # the reverse-proxy + Cloudflare DNS.
    public_port_start: 30000

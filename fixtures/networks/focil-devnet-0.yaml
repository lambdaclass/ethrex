# focil-devnet-0 — EL × CL matrix over the FOCIL (EIP-7805) clients that are
# up to date with the spec.
#
# Client census taken 2026-08-12 from the ethpandaops registry, with the
# staleness verdict from actually booting each one on this devnet:
#
#   ELs   ethrex          ✅ built from this branch
#         besu:focil       2026-07-02  ✅ starts clean against the current genesis
#         geth:focil       2025-07-31  ❌ over a year old
#         reth                         ❌ only pellekrab-focil_impl, a contributor branch
#   CLs   teku:focil       2026-08-11  ✅ current
#         lodestar:focil   2026-06-22  ❌ stale
#         lighthouse:focil 2026-06-16  ❌ stale
#
# lodestar and lighthouse are excluded because their focil images predate the
# summer's Gloas `BeaconState` changes and cannot read a current genesis:
#
#   * against generator 6.1.7+ (the versions that emit `PAYLOAD_DUE_BPS`, which
#     teku requires) lodestar dies in @chainsafe/ssz readVariableOffsets with
#     "First offset must equal to fixedEnd 3134845 != 3134333", and lighthouse
#     with "Built-in genesis state SSZ bytes are invalid: OffsetsAreDecreasing(0)";
#   * against the older generator 6.0.6 lodestar starts, but lighthouse still
#     fails with "Failed to build beacon chain: Head block not found in store",
#     and teku refuses the config for the missing PAYLOAD_DUE_BPS.
#
# So teku is the only consensus client currently able to run FOCIL against a
# spec-current genesis. Add lodestar and lighthouse back when their focil images
# are rebuilt.
#
# Matrix, plus one extra ethrex running --mempool.private so private vs
# gossiping mempool behaviour is observable on the same chain:
#
#   ethrex × teku    besu × teku    ethrex × teku (--mempool.private)
#
# All CLs: supernode=true (PeerDAS satisfaction at fulu/gloas).
#
# Fork schedule (mainnet preset, 12s slots):
#   * gloas at epoch 0 (active from genesis)
#   * heze (= our Hegotá / EIP-7805 FOCIL) at epoch 1
#
# The ethrex image is built from this branch rather than pulled: the published
# ethpandaops/ethrex:focil tag tracks the `focil` branch, which predates both
# the glamsterdam-devnet-8 rebase and the forkchoiceUpdatedV5 custodyColumns fix.
#
# Run with:
#   KURTOSIS_CONFIG_FILE=./fixtures/networks/focil-devnet-0.yaml make localnet

participants:
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    cl_type: teku
    cl_image: ethpandaops/teku:focil
    supernode: true
    count: 1
  - el_type: besu
    el_image: ethpandaops/besu:focil
    cl_type: teku
    cl_image: ethpandaops/teku:focil
    supernode: true
    count: 1
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    el_extra_params:
      - "--mempool.private"
    cl_type: teku
    cl_image: ethpandaops/teku:focil
    supernode: true
    count: 1

network_params:
  preset: mainnet
  gloas_fork_epoch: 0
  heze_fork_epoch: 1

additional_services:
  - dora
  - tx_fuzz
  - spamoor

dora_params:
  image: bbusa/dora:focil

# Generator tag is squeezed from three sides:
#   * 6.0.6 and older predate the `PayloadDueBps` template variable, so their
#     config.yaml carries no `PAYLOAD_DUE_BPS` and teku:focil refuses to start
#     ("missing or invalid values for constants PAYLOAD_DUE_BPS").
#   * 6.1.5 and newer carry generator PR #311 "update to latest spec", which
#     renames the inclusion-list size constant to
#     `MAX_TRANSACTIONS_BYTES_PER_INCLUSION_LIST` — the name consensus-specs has
#     used since the 2026-02-20 Heze promotion. teku:focil still wants the older
#     `MAX_BYTES_PER_INCLUSION_LIST` and logs the new one under "Ignoring unknown
#     items in network configuration" before dying on the missing old name.
#   * 6.2.0 additionally carries PR #313, which deletes the besu and nethermind
#     chainspec templates, while the ethereum-package revision pinned in the
#     Makefile still starts besu with `--genesis-file=/network-configs/besu.json`.
# 6.1.4 is the one tag that satisfies all three.
ethereum_genesis_generator_params:
  image: ethpandaops/ethereum-genesis-generator:6.1.4

spamoor_params:
  spammers:
    - scenario: eoatx
      config:
        throughput: 100
    - scenario: uniswap-swaps
      config:
        throughput: 100
    - scenario: blob-combined
      config:
        throughput: 5

port_publisher:
  additional_services:
    enabled: true
    # Keep 30000 (not the upstream 65500) so the existing Caddy vhosts on
    # ethrex-office-4 (dora.focil.ethrex.xyz → :30000,
    # spamoor.focil.ethrex.xyz → :30004) keep working without rewiring
    # the reverse-proxy + Cloudflare DNS.
    public_port_start: 30000

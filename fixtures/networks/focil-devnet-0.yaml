# focil-devnet-0 — EL × CL matrix over the FOCIL (EIP-7805) clients that can
# actually run against a glamsterdam-devnet-8 execution layer.
#
# Client census taken 2026-08-12 from the ethpandaops registry. Every verdict
# below was established by booting the client on this devnet, not by comparing
# image dates:
#
#   ELs   ethrex           ✅ built from this branch
#         besu:focil       2026-07-02  ❌ see below
#         geth:focil       2025-07-31  ❌ over a year old
#         reth                         ❌ only pellekrab-focil_impl, a contributor branch
#   CLs   teku:focil       2026-08-11  ✅ produces inclusion lists
#         lighthouse:focil 2026-06-16  ✅ fetches from the EL, verifies, republishes
#         lodestar:focil   2026-06-22  ⚠️  runs the chain but performs no IL duty
#
# All three consensus clients work, but only once gloas is kept off genesis (see
# the fork schedule note). With `gloas_fork_epoch: 0` lodestar and lighthouse
# fail to deserialize the genesis state and teku rejects the genesis block root,
# which reads exactly like client staleness and is not.
#
# besu is the one real exclusion. It follows the chain until gloas and then
# rejects every block with
#   SystemCallNoCodeAtAddressException: Invalid system call address:
#   0x0000884d2aa32eaa155f59a2f24efa73d9008282
# That EIP-8282 builder predeploy no longer exists: EIPs commit 554d3325e
# (2026-07-08) "set predeploy addresses from current reference bytecode" moved
# them to 0x0000bFF4...300D8282 and 0x000064D6...800E8282, which is what the
# genesis predeploys and what ethrex calls. The besu:focil image is from six days
# earlier. This is not a devnet-7-vs-8 choice — ethrex uses the canonical pair on
# every branch — so besu needs a rebuild past that commit. A stuck besu is also
# not harmless: its validators drag participation below the finality threshold.
#
# KNOWN CAVEAT — the consensus clients do not peer across build generations.
# teku:focil (2026-08-11) and the June-era lodestar:focil / lighthouse:focil do
# not discover each other. Observed directly: the two teku nodes peer with each
# other and finalise (Justified 144 / Finalized 142), while lighthouse sits at
# `peer_count: 0` with `finalized_epoch: 0`, logging
# `Could not publish message error: NoPeersSubscribedToTopic` on every topic and
# building an isolated chain. In an earlier three-CL run lodestar and lighthouse
# shared a head root with each other while teku had its own, which is the same
# split seen from the other side.
#
# This is NOT fork choice and NOT an EL problem: lighthouse logs zero
# inclusion-list rejections, every execution layer here is ethrex, they are fully
# meshed with each other and log zero errors. An isolated CL simply produces an
# isolated EL head, which looks exactly like a consensus fork — check
# `/eth/v1/node/peer_count` before concluding otherwise. Both sides report the
# same fork versions (0x90000038 / 0x80000038), so the skew is in discovery, not
# the fork schedule.
#
# Consequence for reading results: teku is the pair that finalises and publishes
# inclusion lists; lighthouse independently exercises the other half of the EL
# surface (it fetches inclusion lists from ethrex and verifies/republishes them,
# 10k+ verifications, zero failures) but does not join teku's chain. lodestar is
# omitted because its focil build performs no inclusion-list duty at all — its
# only IL log line is a pre-heze committee-duty warning, and ethrex never sees a
# `engine_getInclusionListV1` call from it — so it adds no FOCIL coverage.
#
# All CLs: supernode=true (PeerDAS satisfaction at fulu/gloas).
#
# Fork schedule (mainnet preset, 12s slots, so one epoch is 6m24s):
#   * gloas at epoch 1  (~6m24s in)
#   * heze (= our Hegotá / EIP-7805 FOCIL) at epoch 2  (~12m48s in)
#
# gloas deliberately does NOT start at genesis. With `gloas_fork_epoch: 0` every
# generator tag tried produces a genesis whose state disagrees with the genesis
# block, and every consensus client refuses to start. Starting pre-gloas and
# transitioning avoids that path entirely — and, as above, is what makes
# lodestar and lighthouse usable at all.
#
# The ethrex image is built from this branch rather than pulled: the published
# ethpandaops/ethrex:focil tag tracks the `focil` branch, which predates both
# the glamsterdam-devnet-8 rebase and the forkchoiceUpdatedV5 custodyColumns fix.
#
# Run with:
#   KURTOSIS_CONFIG_FILE=./fixtures/networks/focil-devnet-0.yaml make localnet

participants:
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    cl_type: teku
    cl_image: ethpandaops/teku:focil
    supernode: true
    count: 1
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:focil
    supernode: true
    count: 1
  - el_type: ethrex
    el_image: ethrex:focil-devnet-0
    el_extra_params:
      - "--mempool.private"
    cl_type: teku
    cl_image: ethpandaops/teku:focil
    supernode: true
    count: 1

network_params:
  preset: mainnet
  gloas_fork_epoch: 1
  heze_fork_epoch: 2

additional_services:
  - dora
  - tx_fuzz
  - spamoor

dora_params:
  image: bbusa/dora:focil

# Generator tag is squeezed from three sides:
#   * 6.0.6 and older predate the `PayloadDueBps` template variable, so their
#     config.yaml carries no `PAYLOAD_DUE_BPS` and teku:focil refuses to start
#     ("missing or invalid values for constants PAYLOAD_DUE_BPS").
#   * 6.1.5 and newer carry generator PR #311 "update to latest spec", which
#     renames the inclusion-list size constant to
#     `MAX_TRANSACTIONS_BYTES_PER_INCLUSION_LIST` — the name consensus-specs has
#     used since the 2026-02-20 Heze promotion. teku:focil still wants the older
#     `MAX_BYTES_PER_INCLUSION_LIST` and logs the new one under "Ignoring unknown
#     items in network configuration" before dying on the missing old name.
#   * 6.2.0 additionally carries PR #313, which deletes the besu and nethermind
#     chainspec templates, while the ethereum-package revision pinned in the
#     Makefile still starts besu with `--genesis-file=/network-configs/besu.json`.
# 6.1.4 is the one tag that satisfies all three.
ethereum_genesis_generator_params:
  image: ethpandaops/ethereum-genesis-generator:6.1.4

spamoor_params:
  spammers:
    - scenario: eoatx
      config:
        throughput: 100
    - scenario: uniswap-swaps
      config:
        throughput: 100
    - scenario: blob-combined
      config:
        throughput: 5

port_publisher:
  additional_services:
    enabled: true
    # Keep 30000 (not the upstream 65500) so the existing Caddy vhosts on
    # ethrex-office-4 (dora.focil.ethrex.xyz → :30000,
    # spamoor.focil.ethrex.xyz → :30004) keep working without rewiring
    # the reverse-proxy + Cloudflare DNS.
    public_port_start: 30000

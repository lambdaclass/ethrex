# heze-devnet-3 — the official devnet config.
#
# Mirrors https://notes.ethereum.org/@ethpandaops/heze-devnet-3. Scope is the Heze
# fork: everything on heze-devnet-2 (EIP-7805 FOCIL, plus EIP-8015 and EIP-8365 on
# the consensus layer only) and EIP-8198 quick slots, which takes slots from 12s to
# 9s at the Heze fork. ethrex is the execution layer; the consensus clients reuse
# their heze-devnet-2 images, as the slot duration change is driven by config.
#
# On the execution layer EIP-8198 (with EIPs #12552) derives the maximum per-block
# base fee change from a block's spacing to its parent, the slot duration over 96
# (3/32 at 9s slots, never more than 1/8), and requires increasing slot numbers.
# Blob throughput per second is kept by a BPO entry at the Heze fork (target 11,
# max 17, update fraction 12241084) that the genesis generator writes; ethrex takes
# blob parameters from the genesis only. The slot duration itself never reaches
# the execution layer.
#
# Run with:
#   KURTOSIS_CONFIG_FILE=./fixtures/networks/heze-devnet-3.yaml make localnet

participants_matrix:
  el:
    - el_type: ethrex
      el_image: ethpandaops/ethrex:heze-devnet-3
  cl:
    - cl_type: lighthouse
      cl_image: ethpandaops/lighthouse:heze-devnet-2
      supernode: true
    - cl_type: lodestar
      cl_image: ethpandaops/lodestar:heze-devnet-2
      supernode: true
    - cl_type: teku
      cl_image: ethpandaops/teku:heze-devnet-2
      supernode: true
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:heze-devnet-2
      vc_image: ethpandaops/prysm-validator:heze-devnet-2
      vc_extra_params:
        - --enable-beacon-rest-api
      supernode: true

network_params:
  gloas_fork_epoch: 0
  heze_fork_epoch: 1
  slot_duration_ms_heze: 9000

additional_services:
  - spamoor
  - dora

global_log_level: debug

ethereum_genesis_generator_params:
  image: ethpandaops/ethereum-genesis-generator:6.2.7

dora_params:
  image: ethpandaops/dora:master
